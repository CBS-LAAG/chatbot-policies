<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp CRM - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>WhatsApp CRM Login</h1>
        <div id="login-form">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button id="loginButton">Login</button>
            <p id="login-error" class="error-message" style="display:none;"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Initial check - if already logged in, redirect to dashboard
        auth.checkAuthRedirect();

        document.getElementById('loginButton').addEventListener('click', auth.handleLogin);
    </script>
</body>
</html>
